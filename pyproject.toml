[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynnow"
version = "3.0"
description = "Dynamical analysis tools for ensemble forecasts, diagnostics computed from Gram matrices (pixel or spectral space)"
authors = [
    {name = "Martin Bonte", email = "martin.bonte@meteo.com"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    'pysteps',
    'xarray>=2025.11',
    'numba',
    'pyshtools',
    'scipy',
]

[tool.setuptools.packages.find]
where = ['src']
